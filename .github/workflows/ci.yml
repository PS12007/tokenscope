name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The mechanism, on its own, on three platforms. No llama.cpp, no model,
  # no network: the core is dependency-free and the tests should prove it.
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: configure (instrumentation ON)
        run: cmake -S . -B build-on -DCMAKE_BUILD_TYPE=Release -DTOKENSCOPE_ENABLED=ON

      - name: build (ON)
        run: cmake --build build-on --config Release

      - name: self-test
        run: ctest --test-dir build-on -C Release --output-on-failure

      # FINDINGS F18: the shared-library build was broken for a whole session
      # because nothing ever built one. F22 fixed it. This arm exists so the
      # next regression is caught by CI rather than by hand, and it runs on all
      # three platforms because the bug was MSVC-only but the fix must not be.
      #
      # ts_dlltest links two separate binaries that each include tokenscope.h,
      # and asserts they have distinct ts_tls caches resolving to one shared
      # buffer per thread. The interesting failure is silent -- a valid trace,
      # zero drops, every scope present, and one thread's work split across two
      # thread ids -- so the test counts thread ids rather than reading them.
      - name: configure (shared libraries)
        run: >
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release
          -DTOKENSCOPE_ENABLED=ON -DBUILD_SHARED_LIBS=ON

      - name: build (shared)
        run: cmake --build build-shared --config Release

      - name: two-module test
        run: ctest --test-dir build-shared -C Release --output-on-failure

      - name: configure (instrumentation OFF)
        run: cmake -S . -B build-off -DCMAKE_BUILD_TYPE=Release -DTOKENSCOPE_ENABLED=OFF

      - name: build (OFF)
        run: cmake --build build-off --config Release

      # "Zero overhead when disabled" cannot be proven with a benchmark -- you
      # cannot demonstrate an absence statistically. It can be proven with a
      # symbol table. See docs/02 section 2.
      - name: verify the OFF build contains no tokenscope symbols
        shell: bash
        run: |
          set -euo pipefail
          lib=$(find build-off -name 'tokenscope.lib' -o -name 'libtokenscope.a' | head -1)
          echo "inspecting $lib"
          if command -v nm >/dev/null 2>&1; then
            n=$(nm -g "$lib" 2>/dev/null | grep -c ' T .*ts_' || true)
          else
            n=$(powershell -Command "dumpbin /symbols '$lib' | Select-String 'External.*ts_' | Measure-Object | % Count")
          fi
          echo "tokenscope symbols in OFF build: $n"
          test "$n" -eq 0

      - name: report sizes
        shell: bash
        run: |
          find build-on build-off \( -name 'tokenscope.lib' -o -name 'libtokenscope.a' \) \
            -exec ls -l {} \;

  # The Python side has no dependencies either, so it gets checked without any.
  tools:
    name: analysis tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: compile-check every script
        run: python -m compileall -q tools scripts

      - name: analyze a committed reference trace
        run: |
          python tools/trace_analyze.py examples/mid-24L-tg256.trace.json
          python tools/trace_analyze.py examples/mid-24L-tg256.trace.json --outliers 5
          python tools/trace_analyze.py examples/mid-24L-tg256.trace.json \
            --diff examples/mid-24L-tg256.trace.json

      # Attributed self-time must not exceed the wall time it is drawn from.
      # This is the check that caught the scope-misparenting bug in docs/FINDINGS
      # F5, so it runs on every commit rather than living in someone's memory.
      # The barrier decomposition must account for every barrier event it was
      # given. tot_wait is summed from barriers matched across threads;
      # split_totals sums the same events independently. If they diverge, some
      # barrier went unmatched and every percentage in the report is computed
      # on a subset -- so the report warns, and CI treats that warning as a
      # failure rather than trusting anyone to read it.
      - name: barrier decomposition must match every barrier
        run: |
          python - <<'PY'
          import glob, io, subprocess, sys
          bad = []
          for path in sorted(glob.glob("examples/*.trace.json")):
              out = subprocess.run([sys.executable, "tools/trace_analyze.py",
                                    path, "--barriers"],
                                   capture_output=True, text=True, check=True).stdout
              if "WARNING: matched" in out:
                  bad.append(path)
              print(f"{path}: {'UNMATCHED BARRIERS' if path in bad else 'ok'}")
          if bad:
              sys.exit(f"unmatched barriers in: {', '.join(bad)}")
          PY

      # FINDINGS F9 as a regression test. At batch size 1 a hidden state is one
      # row, so ggml's row split leaves the elementwise nodes on a single
      # thread; during prefill the same nodes have many rows and parallelize.
      # Both halves are asserted, because the second is what makes the first a
      # mechanism rather than an observation.
      - name: F9 - elementwise nodes are serial in decode, parallel in prefill
        run: |
          python - <<'PY'
          import sys, collections
          sys.path.insert(0, "tools")
          from trace_analyze import Trace, _barrier_groups, _node_base, HOST_CATS

          SERIAL = {"ffn_swiglu", "l_out", "attn_norm", "ffn_norm", "ffn_inp"}

          def busy(path):
              tr = Trace(path)
              _, _, nw = tr.split_totals(only_decode=bool(tr.decode))
              slices = tr.decode if tr.decode else tr.prefill
              agg = collections.defaultdict(lambda: [0, 0.0])
              for t in slices:
                  for nd, _ in _barrier_groups(tr, t["args"]["tok"], nw):
                      durs = [e.get("dur", 0.0) for e in nd]
                      mx = max(durs)
                      active = sum(1 for d in durs if d > 0.25 * mx and d > 0.5)
                      a = agg[_node_base(nd[0]["name"])]
                      a[0] += 1
                      a[1] += active
              return {k: v[1] / v[0] for k, v in agg.items() if k in SERIAL}, nw

          dec, nw_d = busy("examples/mid-24L-L3-tok10-11.trace.json")
          pre, nw_p = busy("examples/mid-24L-L3-pp64.trace.json")
          assert dec and pre, "reference traces lost their node scopes"

          fail = []
          for node in sorted(SERIAL):
              d, p = dec.get(node), pre.get(node)
              if d is None or p is None:
                  fail.append(f"{node}: missing (decode={d}, prefill={p})")
                  continue
              print(f"{node:<12} decode {d:.2f}/{nw_d}   prefill {p:.2f}/{nw_p}")
              if d > 2.5:
                  fail.append(f"{node}: decode uses {d:.2f} threads, expected <= 2.5")
              if p < 6.0:
                  fail.append(f"{node}: prefill uses {p:.2f} threads, expected >= 6.0")
          if fail:
              sys.exit("F9 no longer holds:\n  " + "\n  ".join(fail))
          print("ok: F9 holds -- serial at batch size 1, parallel in prefill")
          PY

      # FINDINGS F16 as a regression test. Two claims: context shift produces a
      # visible periodic spike, and the cell search is a small fraction of the
      # scope named after it. The second is the one that matters -- F2 built a
      # wrong prediction on the assumption that they were the same number.
      - name: F16 - context shift is visible, and find_slot is not slot-search
        run: |
          python - <<'PY'
          import sys, collections
          sys.path.insert(0, "tools")
          from trace_analyze import Trace, self_times, HOST_CATS, pct

          tr = Trace("examples/qwen-ctxshift-c256.trace.json")
          per = collections.defaultdict(float)
          shifts = 0
          for t in tr.decode:
              tok = t["args"]["tok"]
              lo, hi = t["ts"], t["ts"] + t["dur"]
              evs = [e for e in tr.by_token.get(tok, [])
                     if e.get("cat") in HOST_CATS
                     and lo - 1e-6 <= e["ts"]
                     and e["ts"] + e.get("dur", 0.0) <= hi + 1e-6]
              c = collections.defaultdict(float)
              for cat, d in self_times(evs):
                  c[cat] += d
                  per[cat] += d
              if c.get("kv.update", 0.0) > 1000.0:
                  shifts += 1

          n = len(tr.decode)
          find = per.get("kv.find-slot", 0.0)
          slot = per.get("kv.slot-search", 0.0)
          print(f"{n} decode tokens, {shifts} context-shift events")
          print(f"kv.find-slot   {find / n:6.2f} us/tok")
          print(f"kv.slot-search {slot / n:6.2f} us/tok")

          fail = []
          if shifts < 2:
              fail.append(f"expected several context shifts in a 256-cell cache, saw {shifts}")
          if find <= 0:
              fail.append("kv.find-slot scope is missing -- site 13 lost its instrumentation")
          if slot <= 0:
              fail.append("kv.slot-search scope is missing")
          if find > 0.25 * slot:
              fail.append(f"kv.find-slot is {100 * find / slot:.0f}% of kv.slot-search;"
                          " F16 measured 2.7%. If find_slot really got that expensive"
                          " that is a finding, not a test failure -- check before editing"
                          " this threshold.")
          if fail:
              sys.exit("F16 no longer holds:\n  " + "\n  ".join(fail))
          print("ok: F16 holds -- shifts visible, cell search is a small part of the scope")
          PY

      # FINDINGS F28 as a regression test. Worker buffers used to be allocated
      # lazily on first record, so every thread hit the allocator at once on the
      # first token of the capture window and the whole serialised cost landed
      # inside one barrier -- 76-83% of all after-arrival time, and --barriers
      # blamed it on ggml's thread pool. ts_thread_prepare now allocates outside
      # the node loop. The post-fix trace must not contain a barrier that holds
      # a large share of after-arrival time; the pre-fix trace is kept alongside
      # it and MUST still show the artifact, so this check is proved to be
      # capable of failing.
      - name: F28 - no single barrier dominates after-arrival time
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from spinup_probe import trace_stats

          POST = "examples/mid-24L-L3-tok10-11-f28.trace.json"
          PRE  = "examples/mid-24L-L3-tok10-11.trace.json"

          big, node, tok, imb, rel, n = trace_stats(POST)
          share = big / rel if rel else 0.0
          print("post-fix %s: biggest barrier %.1f us = %.1f%% of %.1f us"
                % (POST, big, 100 * share, rel))
          if share > 0.25:
              sys.exit("F28 regressed: one barrier is %.1f%% of after-arrival "
                       "time in %s" % (100 * share, POST))

          big, node, tok, imb, rel, n = trace_stats(PRE)
          share = big / rel if rel else 0.0
          print("pre-fix  %s: biggest barrier %.1f us = %.1f%% of %.1f us"
                % (PRE, big, 100 * share, rel))
          if share < 0.5:
              sys.exit("the pre-fix trace no longer shows the artifact, so the "
                       "check above has never been shown to fail")
          print("ok: F28 holds, and the check is falsifiable")
          PY

      - name: attribution must not exceed 100%
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from trace_analyze import Trace, self_times, HOST_CATS

          import glob
          bad = []
          n = 0
          for path in sorted(glob.glob("examples/*.trace.json")):
              tr = Trace(path)
              n += len(tr.decode)
              for t in tr.decode:
                  tok = t["args"]["tok"]
                  # Host scopes measure wall time on one thread; node scopes
                  # measure thread time across N. Only the former can be
                  # compared against the token slice. Mixing them is the exact
                  # bug this check exists to catch (FINDINGS F5, and the 894%
                  # report that followed it).
                  # Only scopes that lie inside the token's own slice can be
                  # charged against it. Sampling and detokenization belong to a
                  # token but run after llama_context::decode returns, and
                  # counting those here is what first pushed attribution over
                  # 100% when the sampling scopes were added.
                  lo, hi = t["ts"], t["ts"] + t["dur"]
                  evs = [e for e in tr.by_token.get(tok, [])
                         if e.get("cat") in HOST_CATS
                         and lo - 1e-6 <= e["ts"]
                         and e["ts"] + e.get("dur", 0.0) <= hi + 1e-6]
                  total = sum(d for _, d in self_times(evs))
                  if total > t["dur"] * 1.001:
                      bad.append((tok, t["dur"], total))

          for tok, slice_us, total in bad[:5]:
              print(f"token {tok}: slice {slice_us:.1f}us but self-times sum to {total:.1f}us")
          if bad:
              sys.exit(f"{len(bad)} token(s) over-attributed")
          print(f"ok: {n} tokens across all reference traces, none over-attributed")
          PY
